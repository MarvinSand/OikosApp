<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Video 003 · Warum lässt Gott Leid zu? Teil 1 (Stickman-Comic)</title>
<link rel="stylesheet" href="../../brand/brand.css">
<style>html, body { margin: 0; background: #111; overflow: hidden; } canvas { display: block; }</style>
</head>
<body>
<canvas id="c" width="1080" height="1920"></canvas>
<script src="timing.js"></script>
<script>
/* Hilfsfunktionen aus Video 002 (Stickman, Sonne, Kreuz, Texte, …) */
/* ══════════════ Comic-Stickman-Video · reiner Canvas-Code ══════════════
   Ablauf (62 s):  A Hook 0–5 · B Die Lüge 5–15 · C Das Problem 15–25 · D Twist 25–37 · E Geschenk 37–47 · F Ziel + App 47–62
   Verse: Lutherbibel 1912 (gemeinfrei, Schreibweise modernisiert). */
const W = 1080, H = 1920
const cv = document.getElementById('c'), ctx = cv.getContext('2d')
const INK = '#14110f', CREAM = '#fff3d6', YEL = '#ffd83d', RED = '#e63946', GOLD = '#ffb703', SKY = '#4cc3ff', GREEN = '#17a34a'
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x))
const ease = x => 1 - Math.pow(1 - clamp(x), 3)
const eio = x => { x = clamp(x); return x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2 }
const eob = x => { x = clamp(x); const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2) }
const lerp = (a, b, k) => a + (b - a) * k
const h = n => { const s = Math.sin(n * 127.1 + 311.7) * 43758.5453; return s - Math.floor(s) }
let BOIL = 0
const J = (i, amp) => (h(i * 1.7 + BOIL * 13.1) - .5) * 2 * amp

const img = src => { const i = new Image(); i.src = src; return i }
const ICON = img('../../brand/app-icon.png')


/* ── Halftone-Hintergrund (einmal vorgerendert) ── */
const HF = document.createElement('canvas'); HF.width = W; HF.height = H
;(() => { const g = HF.getContext('2d'); g.fillStyle = INK
  for (let y = 0; y < H; y += 30) for (let x = 0; x < W; x += 30) {
    const ox = (y / 30) % 2 ? 15 : 0, px = x + ox
    const d1 = Math.hypot(px - 0, y - H), d2 = Math.hypot(px - W, y - 0)
    const r = Math.max(0, 11 * (1 - Math.min(d1, d2) / 780))
    if (r > .6) { g.beginPath(); g.arc(px, y, r, 0, 6.3); g.fill() } } })()

/* ── Zeichen-Helfer (Linien „zittern“ wie handgezeichnet) ── */
function stroke(pts, w = 10, col = INK, close = false, amp = 2.4) {
  ctx.strokeStyle = col; ctx.lineWidth = w; ctx.lineCap = 'round'; ctx.lineJoin = 'round'; ctx.beginPath()
  pts.forEach((p, i) => { const x = p[0] + J(i * 2, amp), y = p[1] + J(i * 2 + 1, amp); i ? ctx.lineTo(x, y) : ctx.moveTo(x, y) })
  if (close) ctx.closePath(); ctx.stroke()
}
function rr(x, y, w, hh, r, fill, line = INK, lw = 8) {
  ctx.beginPath(); ctx.roundRect(x, y, w, hh, r)
  if (fill) { ctx.fillStyle = fill; ctx.fill() } if (line) { ctx.strokeStyle = line; ctx.lineWidth = lw; ctx.lineJoin = 'round'; ctx.stroke() }
}
function wrap(text, maxW) { const out = []; let cur = ''; text.split(' ').forEach(w => { const t = cur ? cur + ' ' + w : w; if (ctx.measureText(t).width > maxW && cur) { out.push(cur); cur = w } else cur = t }); out.push(cur); return out }

/* ── Stickman ── */
const dir = a => [Math.sin(a), Math.cos(a)]
function limb(ox, oy, a1, a2, l1, l2) { const d1 = dir(a1), kx = ox + d1[0] * l1, ky = oy + d1[1] * l1, d2 = dir(a1 + a2); return [[ox, oy], [kx, ky], [kx + d2[0] * l2, ky + d2[1] * l2]] }
function face(c, f, kind) {
  ctx.fillStyle = INK; ctx.strokeStyle = INK; ctx.lineCap = 'round'; ctx.lineWidth = 6
  const ex = c[0] + f * 9, ey = c[1] - 6
  const dots = () => { [-15, 15].forEach(d => { ctx.beginPath(); ctx.arc(ex + d, ey, 5.5, 0, 6.3); ctx.fill() }) }
  const brow = (a, b) => { ctx.beginPath(); ctx.moveTo(ex - 28, ey - 16 - a); ctx.lineTo(ex - 6, ey - 16 - b); ctx.moveTo(ex + 6, ey - 16 - b); ctx.lineTo(ex + 28, ey - 16 - a); ctx.stroke() }
  if (kind === 'smile') { dots(); ctx.beginPath(); ctx.arc(ex, c[1] + 6, 17, .15 * Math.PI, .85 * Math.PI); ctx.stroke() }
  else if (kind === 'shock') { [-16, 16].forEach(d => { ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(ex + d, ey, 11, 0, 6.3); ctx.fill(); ctx.lineWidth = 4; ctx.stroke(); ctx.fillStyle = INK; ctx.beginPath(); ctx.arc(ex + d + f * 3, ey, 4, 0, 6.3); ctx.fill() }); ctx.lineWidth = 6; ctx.beginPath(); ctx.ellipse(ex, c[1] + 24, 9, 12, 0, 0, 6.3); ctx.stroke() }
  else if (kind === 'sad') { dots(); brow(-6, 8); ctx.beginPath(); ctx.arc(ex, c[1] + 30, 15, 1.15 * Math.PI, 1.85 * Math.PI); ctx.stroke() }
  else if (kind === 'determined') { dots(); brow(8, -4); ctx.beginPath(); ctx.moveTo(ex - 12, c[1] + 20); ctx.lineTo(ex + 12, c[1] + 20); ctx.stroke() }
  else if (kind === 'dizzy') { [-15, 15].forEach(d => { ctx.beginPath(); ctx.moveTo(ex + d - 8, ey - 8); ctx.lineTo(ex + d + 8, ey + 8); ctx.moveTo(ex + d + 8, ey - 8); ctx.lineTo(ex + d - 8, ey + 8); ctx.stroke() }); ctx.beginPath(); ctx.moveTo(ex - 14, c[1] + 22); ctx.quadraticCurveTo(ex - 7, c[1] + 14, ex, c[1] + 22); ctx.quadraticCurveTo(ex + 7, c[1] + 30, ex + 14, c[1] + 22); ctx.stroke() }
  else if (kind === 'joy') { [-15, 15].forEach(d => { ctx.beginPath(); ctx.arc(ex + d, ey + 4, 9, 1.15 * Math.PI, 1.85 * Math.PI); ctx.stroke() }); ctx.beginPath(); ctx.arc(ex, c[1] + 12, 19, 0, Math.PI); ctx.closePath(); ctx.fill() }
}
function figure(x, y, s, P = {}, o = {}) {
  const p = Object.assign({ lean: 0, tilt: 0, rot: 0, face: 'smile', f: 1, aA: [.3, .2], aB: [-.3, -.2], lA: [.12, 0], lB: [-.12, 0] }, P)
  ctx.save(); ctx.translate(x, y); ctx.rotate(p.rot); ctx.scale(s, s)
  const neck = [Math.sin(p.lean) * 150, -Math.cos(p.lean) * 150], sh = [neck[0] * .9, neck[1] * .9]
  const A = limb(sh[0], sh[1], p.aA[0], p.aA[1], 88, 82), B = limb(sh[0], sh[1], p.aB[0], p.aB[1], 88, 82)
  const LA = limb(0, 0, p.lA[0], p.lA[1], 100, 100), LB = limb(0, 0, p.lB[0], p.lB[1], 100, 100)
  const w = o.w || 11, col = o.col || INK
  stroke(B, w, col)
  if (!o.robe) { stroke(LB, w, col); stroke(LA, w, col) }
  stroke([[0, 0], neck], w, col)
  if (o.robe) {
    ctx.beginPath(); ctx.moveTo(sh[0] - 30, sh[1]); ctx.lineTo(sh[0] + 30, sh[1]); ctx.lineTo(70, 215); ctx.lineTo(-70, 215); ctx.closePath()
    ctx.fillStyle = '#fff'; ctx.fill(); ctx.strokeStyle = INK; ctx.lineWidth = 9; ctx.lineJoin = 'round'; ctx.stroke()
    stroke([[sh[0] - 14, sh[1] + 70], [sh[0] + 14, sh[1] + 70]], 9, GOLD)
    ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.ellipse(-26, 222, 30, 12, 0, 0, 6.3); ctx.ellipse(26, 222, 30, 12, 0, 0, 6.3); ctx.fill(); ctx.stroke()
  }
  stroke(A, w, col)
  const hd = [neck[0] + Math.sin(p.lean + p.tilt) * 48, neck[1] - Math.cos(p.lean + p.tilt) * 48]
  if (o.halo) { ctx.save(); ctx.shadowColor = GOLD; ctx.shadowBlur = 40; ctx.strokeStyle = GOLD; ctx.lineWidth = 11; ctx.beginPath(); ctx.ellipse(hd[0], hd[1] - 64, 42, 13, 0, 0, 6.3); ctx.stroke(); ctx.restore() }
  ctx.beginPath(); ctx.arc(hd[0], hd[1], 47 + J(99, 1), 0, 6.3); ctx.fillStyle = '#fff'; ctx.fill(); ctx.strokeStyle = col; ctx.lineWidth = w; ctx.stroke()
  face(hd, p.f, p.face)
  const cs = Math.cos(p.rot), sn = Math.sin(p.rot), toW = q => [x + (q[0] * cs - q[1] * sn) * s, y + (q[0] * sn + q[1] * cs) * s]
  ctx.restore()
  return { handA: toW(A[2]), handB: toW(B[2]), head: toW(hd) }
}
const POSE = {
  walk: (ph, extra = {}) => Object.assign({ aA: [Math.sin(ph) * .6, .3], aB: [-Math.sin(ph) * .6, .3], lA: [-Math.sin(ph) * .55, 0], lB: [Math.sin(ph) * .55, 0] }, extra),
  cheer: (ph, extra = {}) => Object.assign({ aA: [Math.PI - .35 + Math.sin(ph) * .25, .2], aB: [-Math.PI + .35 - Math.sin(ph) * .25, -.2], lA: [.35, 0], lB: [-.35, 0], face: 'joy' }, extra),
  shrug: (extra = {}) => Object.assign({ aA: [1.9, 1.0], aB: [-1.9, -1.0], face: 'shock' }, extra),
}
function stars(c, t, n = 3) { for (let i = 0; i < n; i++) { const a = t * 5 + i * 6.28 / n; ctx.fillStyle = GOLD; ctx.strokeStyle = INK; ctx.lineWidth = 3; ctx.save(); ctx.translate(c[0] + Math.cos(a) * 70, c[1] - 70 + Math.sin(a) * 18); ctx.rotate(a); ctx.beginPath(); for (let k = 0; k < 10; k++) { const r = k % 2 ? 7 : 16, an = k * Math.PI / 5; ctx.lineTo(Math.sin(an) * r, -Math.cos(an) * r) } ctx.closePath(); ctx.fill(); ctx.stroke(); ctx.restore() } }

/* ── Text ── */
function caption(text, t0, t1, t, o = {}) {
  if (t < t0 || t > t1 + .3) return
  const size = o.size || 96, y = o.y || 430, maxW = o.maxW || 900
  ctx.save(); ctx.font = `${o.weight || 800} ${size}px ${o.fam || 'Inter'}`; ctx.textBaseline = 'middle'; ctx.lineJoin = 'round'
  const toks = []; let em = false
  text.split(' ').forEach(tok => { let e = em, out = ''; for (const ch of tok) { if (ch === '*') { em = !em; if (em) e = true } else out += ch } toks.push({ w: out, e }) })
  const sp = ctx.measureText(' ').width; const lines = []; let cur = [], cw = 0
  toks.forEach(tk => { tk.m = ctx.measureText(tk.w).width; if (cw + tk.m > maxW && cur.length) { lines.push(cur); cur = []; cw = 0 } cur.push(tk); cw += tk.m + sp })
  lines.push(cur)
  const lh = size * 1.14, outA = 1 - clamp((t - t1) / .25); let idx = 0
  lines.forEach((ln, li) => {
    const tw = ln.reduce((a, k) => a + k.m + sp, -sp); let x = 540 - tw / 2
    ln.forEach(tk => {
      const k = eob((t - t0 - idx * (o.stagger || .11)) / .28); idx++
      if (k > 0) {
        ctx.save(); ctx.globalAlpha = outA * clamp(k * 1.5); ctx.translate(x + tk.m / 2, y + li * lh); const sc = .4 + .6 * k; ctx.scale(sc, sc); ctx.rotate((1 - k) * (idx % 2 ? -.12 : .12)); ctx.textAlign = 'center'
        ctx.lineWidth = size * .17; ctx.strokeStyle = o.stroke || INK; ctx.strokeText(tk.w, 0, 0); ctx.fillStyle = tk.e ? (o.emph || RED) : (o.color || '#fff'); ctx.fillText(tk.w, 0, 0); ctx.restore()
      }
      x += tk.m + sp
    })
  })
  ctx.restore()
}
function verse(text, ref, t0, t1, t, o = {}) {
  if (t < t0 || t > t1 + .3) return
  const k = eob((t - t0) / .35), a = 1 - clamp((t - t1) / .25), cy = o.y || 1000
  ctx.save(); ctx.globalAlpha = a; ctx.font = 'italic 500 52px Lora'
  const lines = wrap(text, 800), bh = lines.length * 66 + 120, bw = 900
  ctx.translate(540, cy); ctx.scale(.7 + .3 * k, .7 + .3 * k); ctx.rotate((1 - k) * .06)
  rr(-bw / 2 + 14, -bh / 2 + 14, bw, bh, 26, INK, null); rr(-bw / 2, -bh / 2, bw, bh, 26, '#fff', INK, 8)
  ctx.fillStyle = INK; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'
  lines.forEach((l, i) => ctx.fillText(l, 0, -bh / 2 + 56 + i * 66))
  ctx.font = '800 30px Inter'; ctx.fillStyle = '#b45309'; ctx.fillText(ref.toUpperCase() + '  ·  LUTHER 1912', 0, bh / 2 - 42)
  ctx.restore()
}
function bubble(text, x, y, t0, t1, t, tail = [x, y + 90], size = 60) {
  if (t < t0 || t > t1 + .25) return
  const k = eob((t - t0) / .3), a = 1 - clamp((t - t1) / .2)
  ctx.save(); ctx.globalAlpha = a; ctx.font = `700 ${size}px Caveat`; const tw = ctx.measureText(text).width, bw = tw + 70, bh = size + 50
  ctx.translate(x, y); ctx.scale(k, k)
  ctx.beginPath(); ctx.moveTo(-18, bh / 2 - 4); ctx.lineTo(tail[0] - x, tail[1] - y); ctx.lineTo(22, bh / 2 - 4); ctx.closePath(); ctx.fillStyle = '#fff'; ctx.fill(); ctx.strokeStyle = INK; ctx.lineWidth = 8; ctx.lineJoin = 'round'; ctx.stroke()
  rr(-bw / 2, -bh / 2, bw, bh, 34, '#fff', INK, 8)
  ctx.beginPath(); ctx.moveTo(-14, bh / 2 - 6); ctx.lineTo(18, bh / 2 - 6); ctx.strokeStyle = '#fff'; ctx.lineWidth = 12; ctx.stroke()
  ctx.fillStyle = INK; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText(text, 0, 4); ctx.restore()
}

/* ── Requisiten ── */
function sunFig(x, y, r, t, a = 1, mood = 'smile') {
  ctx.save(); ctx.globalAlpha = a; ctx.translate(x, y)
  ctx.save(); ctx.rotate(t * .35)
  for (let i = 0; i < 14; i++) { ctx.rotate(Math.PI * 2 / 14); ctx.beginPath(); ctx.moveTo(-r * .2, -r * 1.2); ctx.lineTo(0, -r * (1.62 + (i % 2) * .18)); ctx.lineTo(r * .2, -r * 1.2); ctx.closePath(); ctx.fillStyle = GOLD; ctx.fill(); ctx.strokeStyle = INK; ctx.lineWidth = 7; ctx.lineJoin = 'round'; ctx.stroke() }
  ctx.restore()
  ctx.beginPath(); ctx.arc(0, 0, r, 0, 6.3); ctx.fillStyle = '#ffd23f'; ctx.fill(); ctx.strokeStyle = INK; ctx.lineWidth = 10; ctx.stroke()
  ctx.lineWidth = 7; ctx.lineCap = 'round'; [-1, 1].forEach(d => { ctx.beginPath(); ctx.arc(d * r * .34, -r * .1, r * .13, 1.1 * Math.PI, 1.9 * Math.PI); ctx.stroke() })
  ctx.beginPath(); ctx.arc(0, r * .14, r * .34, .15 * Math.PI, .85 * Math.PI); ctx.stroke()
  ctx.fillStyle = 'rgba(255,120,90,.5)'; [-1, 1].forEach(d => { ctx.beginPath(); ctx.arc(d * r * .6, r * .16, r * .12, 0, 6.3); ctx.fill() })
  ctx.restore()
}
function brickRect(x, y, w, hh, fill = '#f4b183') {
  ctx.fillStyle = fill; ctx.fillRect(x, y, w, hh); ctx.strokeStyle = INK; ctx.lineWidth = 5
  for (let yy = y + 60, r = 0; yy < y + hh; yy += 60, r++) { ctx.beginPath(); ctx.moveTo(x, yy); ctx.lineTo(x + w, yy); ctx.stroke() }
  for (let yy = y, r = 0; yy < y + hh; yy += 60, r++) for (let xx = x + (r % 2 ? 30 : 60); xx < x + w; xx += 60) { ctx.beginPath(); ctx.moveTo(xx, yy); ctx.lineTo(xx, Math.min(yy + 60, y + hh)); ctx.stroke() }
  ctx.lineWidth = 9; ctx.strokeRect(x, y, w, hh)
}
function stampFig(x, y, k, rot = -.2, text = 'BEZAHLT') {
  if (k <= 0) return
  const sc = k < 1 ? 3 - 2 * eob(k) + 0 : 1
  ctx.save(); ctx.translate(x, y); ctx.rotate(rot); ctx.scale(sc, sc); ctx.globalAlpha = clamp(k * 3)
  ctx.font = '800 150px Inter'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'
  const tw = ctx.measureText(text).width + 70
  rr(-tw / 2, -120, tw, 240, 24, 'rgba(255,255,255,.35)', GREEN, 14); rr(-tw / 2 + 18, -102, tw - 36, 204, 14, null, GREEN, 5)
  ctx.fillStyle = GREEN; ctx.fillText(text, 0, 8); ctx.restore()
}
function bill(x, y, sc, rot, o = {}) {
  ctx.save(); ctx.translate(x, y); ctx.rotate(rot); ctx.scale(sc, sc)
  ctx.globalAlpha = .28; rr(-226, -306, 480, 640, 14, INK, null); ctx.globalAlpha = 1
  rr(-240, -320, 480, 640, 14, '#fffdf6', INK, 9)
  ctx.fillStyle = RED; ctx.fillRect(-235, -315, 470, 96); ctx.font = '800 54px Inter'; ctx.fillStyle = '#fff'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText('RECHNUNG', 0, -267)
  ctx.fillStyle = INK; ctx.font = '700 31px Inter'; ctx.fillText('Schuld gegenüber Gott', 0, -170)
  ctx.strokeStyle = '#c9c2b2'; ctx.lineWidth = 6; for (let i = 0; i < 5; i++) { ctx.beginPath(); ctx.moveTo(-180, -110 + i * 46); ctx.lineTo(i % 2 ? 100 : 180, -110 + i * 46); ctx.stroke() }
  ctx.fillStyle = RED; ctx.font = `800 ${o.amountSize || 130}px Inter`; ctx.fillText(o.amount || '∞ €', 0, 150)
  if (o.stamp > 0) stampFig(0, 40, o.stamp, -.22)
  ctx.restore()
}
function cross(x, y, k = 1, glow = 0) {
  ctx.save(); ctx.translate(x, y)
  if (glow) { ctx.shadowColor = GOLD; ctx.shadowBlur = 60 * glow }
  const v = clamp(k * 1.5), hz = clamp((k - .5) * 2)
  ctx.fillStyle = '#e0a15a'; ctx.strokeStyle = INK; ctx.lineWidth = 9; ctx.lineJoin = 'round'
  ctx.beginPath(); ctx.rect(-36, 0, 72, 820 * v); ctx.fill(); ctx.stroke()
  if (hz > 0) { ctx.beginPath(); ctx.rect(-170 * hz, 190, 340 * hz, 72); ctx.fill(); ctx.stroke() }
  ctx.restore()
}
function burst(cx0, cy0, t, col, n = 22, speed = .12) {
  ctx.save(); ctx.translate(cx0, cy0); ctx.rotate(t * speed); ctx.fillStyle = col
  for (let i = 0; i < n; i += 2) { const a0 = i * Math.PI * 2 / n, a1 = (i + 1) * Math.PI * 2 / n; ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(Math.cos(a0) * 2600, Math.sin(a0) * 2600); ctx.lineTo(Math.cos(a1) * 2600, Math.sin(a1) * 2600); ctx.closePath(); ctx.fill() }
  ctx.restore()
}
const CONF = Array.from({ length: 80 }, (_, i) => ({ x: h(i) * W, sp: 300 + h(i + 9) * 500, ph: h(i + 3) * 6, sz: 14 + h(i + 5) * 16, c: [RED, GOLD, SKY, GREEN, '#ff7ab6'][i % 5], d: h(i + 7) * 1.5 }))
function confetti(t, t0) { if (t < t0) return; CONF.forEach(p => { const u = t - t0 - p.d; if (u < 0) return; const y = -40 + u * p.sp * .75 + 120 * Math.sin(u * 2 + p.ph); if (y > H + 40) return; ctx.save(); ctx.translate(p.x + Math.sin(u * 3 + p.ph) * 50, y); ctx.rotate(u * 5 + p.ph); ctx.fillStyle = p.c; ctx.fillRect(-p.sz / 2, -p.sz / 4, p.sz, p.sz / 2); ctx.restore() }) }

</script>
