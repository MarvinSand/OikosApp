name: Android Release (Google Play)

on:
  workflow_dispatch: {}

jobs:
  build-aab:
    runs-on: ubuntu-latest
    env:
      PLAY_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install web dependencies
        run: npm ci

      - name: Build web app
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_GOOGLE_MAPS_API_KEY: ${{ secrets.VITE_GOOGLE_MAPS_API_KEY }}
          VITE_LEGAL_NAME: ${{ vars.VITE_LEGAL_NAME }}
          VITE_LEGAL_ADDRESS: ${{ vars.VITE_LEGAL_ADDRESS }}
          VITE_SUPPORT_EMAIL: ${{ vars.VITE_SUPPORT_EMAIL }}
          VITE_PUBLIC_APP_URL: ${{ vars.VITE_PUBLIC_APP_URL }}

      - name: Sync Capacitor Android project
        run: npx cap sync android

      - name: Decode upload keystore
        id: ks
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/upload.keystore"
            echo "path=$RUNNER_TEMP/upload.keystore" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::ANDROID_KEYSTORE_BASE64 fehlt – es wird ein UNSIGNIERTES Bundle gebaut (nicht für Google Play nutzbar)."
            echo "path=" >> "$GITHUB_OUTPUT"
          fi

      - name: Build signed App Bundle
        working-directory: android
        env:
          ANDROID_KEYSTORE_PATH: ${{ steps.ks.outputs.path }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          # Jeder Play-Upload braucht eine höhere Versionsnummer als der vorherige
          ANDROID_VERSION_CODE: ${{ github.run_number }}
          ANDROID_VERSION_NAME: "1.0.${{ github.run_number }}"
        run: ./gradlew bundleRelease --no-daemon

      - name: Upload App Bundle as artifact
        uses: actions/upload-artifact@v4
        with:
          name: oikos-connect-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
          retention-days: 30

      # Optional: automatischer Upload in Google Play (erst nach dem ersten
      # manuellen Upload in der Play Console + Service-Account-Secret)
      - name: Upload to Google Play (internal track)
        if: ${{ env.PLAY_JSON != '' }}
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: app.oikos.mobile
          releaseFiles: android/app/build/outputs/bundle/release/app-release.aab
          track: internal
          status: completed
